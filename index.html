<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TubeFetch</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:#1a1a1a;
    border:1px solid #2b2b2b;
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 40px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

.input-group{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#262626;
    color:white;
    font-size:16px;
}

button{
    padding:16px 22px;
    border:none;
    border-radius:12px;
    background:#ff0000;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:#ff1f1f;
}

.result{
    margin-top:30px;
    display:none;
    background:#222;
    padding:20px;
    border-radius:15px;
}

.thumbnail{
    width:100%;
    border-radius:12px;
    margin-bottom:15px;
}

.video-title{
    font-size:20px;
    margin-bottom:15px;
}

.downloads{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.download-btn{
    text-decoration:none;
    background:#333;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    transition:.2s;
}

.download-btn:hover{
    background:#444;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#666;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>TubeFetch</h1>
    <p>Download YouTube videos as MP4 instantly.</p>

    <div class="input-group">
        <input type="text" id="url" placeholder="Paste YouTube URL here">
        <button onclick="fetchVideo()">Fetch</button>
    </div>

    <div class="result" id="result">
        <img id="thumb" class="thumbnail">
        <div class="video-title" id="title"></div>

        <div class="downloads">
            <a id="download720" class="download-btn" target="_blank">
                Download 720p MP4
            </a>

            <a id="download360" class="download-btn" target="_blank">
                Download 360p MP4
            </a>
        </div>
    </div>

    <div class="footer">
        Built with HTML, CSS and JavaScript
    </div>
</div>

<script>
async function fetchVideo() {
    const url = document.getElementById("url").value;
    const result = document.getElementById("result");

    if (!url.includes("youtube.com") && !url.includes("youtu.be")) {
        alert("Please enter a valid YouTube URL");
        return;
    }

    try {
        const response = await fetch(
            "https://noembed.com/embed?url=" + encodeURIComponent(url)
        );

        const data = await response.json();

        document.getElementById("thumb").src = data.thumbnail_url;
        document.getElementById("title").innerText = data.title;

        // Demo download links
        // Replace with your backend/API

        document.getElementById("download720").href =
            "https://www.y2mate.com/youtube/" + extractID(url);

        document.getElementById("download360").href =
            "https://www.y2mate.com/youtube/" + extractID(url);

        result.style.display = "block";

    } catch (err) {
        alert("Failed to fetch video.");
        console.error(err);
    }
}

function extractID(url) {
    const regExp =
        /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;

    const match = url.match(regExp);

    return (match && match[7].length == 11)
        ? match[7]
        : false;
}
</script>

</body>
</html>
